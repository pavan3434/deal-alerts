name: Keep schedule alive

# GitHub turns off scheduled workflows after 60 days without repo activity.
# This makes a tiny commit on the 1st of every month so alerts never stop.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          date -u > .keepalive
          git config user.name "deal-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push
